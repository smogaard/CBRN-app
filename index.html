      // =============================
      // ELVIS TILES
      // =============================

		
      function distMeters(a, b) {
        const dx = (a.lat - b[0]) * 111000;
        const dy = (a.lng - b[1]) * 111000 * Math.cos((a.lat * Math.PI) / 180);

        return Math.sqrt(dx * dx + dy * dy);
      }

		
      async function loadGrid() {
        const res = await fetch("grid.geojson");
        const data = await res.json();
        gridLayer = data;
      }

		
      loadGrid();

		
      function findTileId(lat, lng) {
        for (let feature of gridLayer.features) {
          const coords = feature.geometry.coordinates[0];

          let inside = false;

          for (let i = 0, j = coords.length - 1; i < coords.length; j = i++) {
            const xi = coords[i][1];
            const yi = coords[i][0];
            const xj = coords[j][1];
            const yj = coords[j][0];

            const intersect =
            yi > lng !== yj > lng &&
            lat < ((xj - xi) * (lng - yi)) / (yj - yi) + xi;

            if (intersect) inside = !inside;
          }

          if (inside) {
            return feature.properties.tile_id;
          }
        }

        return null;
      }

		
      async function loadTile(type, lat, lng) {
        if (!gridLayer) {
          console.warn("Grid ikke lastet enda");
          return Promise.resolve();
        }

        const id = findTileId(lat, lng);
        console.log("Tile ID:", id);
		  
        if (!id) return Promise.resolve();

        const key = `${type}_${id}`;

        if (loadedTiles[key]) return Promise.resolve();

        const filename = `${type}_tiles/${type}_tile_id_${id}.geojson`;
        console.log("Prøver å laste:", filename);

		  
        try {
          const res = await fetch(filename);
          const data = await res.json();

          loadedTiles[key] = data;

          console.log("Loaded:", filename);

			
          // 🔵 ELVIS (linjer)
          if (type === "elvis") {
            L.geoJSON(data, { color: "#00ffff", weight: 1 }).addTo(map);
          }

			
          // 🟡 INNSJØ (flater)
          if (type === "innsjo") {
            L.geoJSON(data, {
              color: "#3399ff",
              weight: 1,
              fillOpacity: 0.2,
            }).addTo(map);
          }

          return data;
        } catch (e) {
          console.warn("Manglende tile:", filename);
            return null;
        }
      }


      /* =============================
      2 ICON  
      ============================= */
      const icon = L.divIcon({
        html: '<div style="font-size:42px; transform:translate(-2px,2px)">💥</div>',
        className: "",
        iconSize: [50, 50],
        iconAnchor: [27, 28],
      });


      /* =============================
      3 ERG
      ============================= */
      const ERG_DATA = [
        { un: "1017", name: "Klor", hot: 200, warm: 1500 },
        { un: "1005", name: "Ammoniakk", hot: 100, warm: 500 },
      ];

      function findByUN(u) {
        return ERG_DATA.find((e) => e.un === u);
      }
      
      function findByName(n) {
        return ERG_DATA.find((e) => e.name.toLowerCase() === n.toLowerCase());
      }

      
      /* =============================
      4 DAG/NATT
      ============================= */
      function getSunTimes(lat, lon, date) {
        const rad = Math.PI / 180;

        const day = Math.floor(
          (Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) -
          Date.UTC(date.getFullYear(), 0, 0)) /
          86400000,
        );

        const lngHour = lon / 15;

        function calc(isSunrise) {
          const t = day + ((isSunrise ? 6 : 18) - lngHour) / 24;

          const M = 0.9856 * t - 3.289;

          let L =
            M +
            1.916 * Math.sin(M * rad) +
            0.02 * Math.sin(2 * M * rad) +
            282.634;

          L = (L + 360) % 360;

          let RA = Math.atan(0.91764 * Math.tan(L * rad)) / rad;
          RA = (RA + 360) % 360;
          RA = RA / 15;

          const sinDec = 0.39782 * Math.sin(L * rad);
          const cosDec = Math.cos(Math.asin(sinDec));

          const cosH =
            (Math.cos(90.833 * rad) - sinDec * Math.sin(lat * rad)) /
            (cosDec * Math.cos(lat * rad));

          if (cosH > 1) return null; // alltid natt
          if (cosH < -1) return null; // alltid dag

          let H = isSunrise
            ? 360 - Math.acos(cosH) / rad
            : Math.acos(cosH) / rad;

          H = H / 15;

          const T = H + RA - 0.06571 * t - 6.622;

          return (T - lngHour) % 24;
        }

        return {
          sunrise: calc(true),
          sunset: calc(false),
        };
      }

      function getDayNight(date, pos) {
        if (!date || !pos) return "day";

        const lat = pos.lat;
        const lon = pos.lng;

        const sun = getSunTimes(lat, lon, date);

        // ✅ polarnatt / midnattssol
        if (sun.sunrise === null || sun.sunset === null) {
          return sun.sunrise === null ? "night" : "day";
        }

        // lokal tid (inkl sommertid)
        const hours = date.getHours() + date.getMinutes() / 60;

        const offset = -date.getTimezoneOffset() / 60;

        let sunriseLocal = sun.sunrise + offset;
        let sunsetLocal = sun.sunset + offset;

        // normaliser
        if (sunriseLocal < 0) sunriseLocal += 24;
        if (sunriseLocal > 24) sunriseLocal -= 24;

        if (sunsetLocal < 0) sunsetLocal += 24;
        if (sunsetLocal > 24) sunsetLocal -= 24;

        return hours >= sunriseLocal && hours <= sunsetLocal ? "day" : "night";
      }
      
		
      /* =============================
      5 WEATHER
      ============================= */

      async function getHistoricalWeather(lat, lon, time) {
        const url = `/api/frost?time=${time.toISOString()}`;

        try {
          const res = await fetch(url);
          const json = await res.json();

          if (json.data && json.data.length > 0) {
            const observations = json.data[0].observations;

            let result = {};

            for (const item of observations) {
              result[item.elementId] = item.value;
            }

            return {
              air_temperature: result.air_temperature,
              wind_speed: result.wind_speed,
              wind_from_direction: result.wind_from_direction,
            };
          }
        } catch (e) {
          return null;
        }
      }


		  async function updateWeather() {
        const pos = marker.getLatLng();
        const url = `https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${pos.lat}&lon=${pos.lng}`;

        try {
          const res = await fetch(url, {
            headers: { "User-Agent": "CBRN-App" },
          });
          
          const data = await res.json();
          const now = data.properties.timeseries[0].data.instant.details;

          t0data = null;

          // ===== Hente historiske værdata =====

          // ===== T0 LOGIKK (fortid vs fremtid) =====
          const t0time = t0.value ? new Date(t0.value) : null;
          const nowTime = new Date();

          if (t0time) {
            if (t0time < nowTime) {
              // 🔥 HISTORISK DATA
              const hist = await getHistoricalWeather(pos.lat, pos.lng, t0time);

              if (hist) {
                t0data = hist;
              }
            } else {
              // 🔥 FREMTID (forecast)
              for (const ts of data.properties.timeseries) {
                const tsTime = new Date(ts.time);

                if (tsTime >= t0time) {
                  t0data = ts.data.instant.details;
                  break;
                }
              }
            }
          }

          if (!marker) return;
          temp_now.innerHTML = now.air_temperature + " °C";

          wind_now.innerHTML =
            windArrow(now.wind_from_direction + 180) +
            " " +
            "fra " +
            windText(now.wind_from_direction) +
            " " +
            now.wind_speed.toFixed(1) +
            " m/s";

          lastWindDir = now.wind_from_direction;

          if (dynamicPlume) {
            map.removeLayer(dynamicPlume);
          }

          // fallback hvis t=0 ikke er satt
          if (!t0.value) {
            temp_t0.innerHTML = "-";
            wind_t0.innerHTML = "-";
          }

          // fallback hvis ingenting ble funnet
          if (!t0data && t0time) {
            for (const ts of data.properties.timeseries) {
              const tsTime = new Date(ts.time);

              if (tsTime >= t0time) {
                t0data = ts.data.instant.details;
                break;
              }
            }
          }

          const elapsedHours = t0time
            ? Math.max(1, (nowTime - t0time) / (1000 * 60 * 60))
            : 1;

          // oppdater vind
          if (t0data && t0data.wind_from_direction !== undefined) {
            t0WindDir = t0data.wind_from_direction;
          }

          if (t0.value) {
            const windTrack = [];

            for (const ts of data.properties.timeseries) {
              const tsTime = new Date(ts.time);

              if (tsTime >= t0time && tsTime <= nowTime) {
                windTrack.push({
                  dir: ts.data.instant.details.wind_from_direction,
                  speed: ts.data.instant.details.wind_speed,
                  time: ts.time,
                });
              }

              if (windTrack.length >= Math.ceil(elapsedHours * 2)) break;
            }

            // ✅ legg til T0 én gang (ETTER loopen)
            windTrack.unshift({
              dir: t0data.wind_from_direction,
              speed: t0data.wind_speed,
              time: t0time.toISOString(),
            });

            console.log("windTrack:", windTrack);

            dynamicPlume = createDynamicPlume(
              marker.getLatLng(),
              Number(hot.value),
              windTrack,
              t0WindDir,
            );

            if (dynamicPlume) {
              map.addLayer(dynamicPlume);
            }
          } else {
            // fjern plume hvis T0 ikke er satt
            if (dynamicPlume) {
              map.removeLayer(dynamicPlume);
              dynamicPlume = null;
            }
          }

          //UI (uendret)
          temp_t0.innerHTML = t0data.air_temperature ?? "-";

          wind_t0.innerHTML =
            t0data.wind_from_direction != null
              ? windArrow(t0data.wind_from_direction + 180) +
                " " +
                "fra " +
                windText(t0data.wind_from_direction) +
                " " +
                (t0data.wind_speed ?? 0).toFixed(1) +
                " m/s"
              : "-";

          updateMap();
        } catch (e) {
          dynamicPlume = null;
        }
      }

		
      function windText(d) {
        const dirs = [
          "N",
          "NNØ",
          "NØ",
          "ØNØ",
          "Ø",
          "ØSØ",
          "SØ",
          "SSØ",
          "S",
          "SSV",
          "SV",
          "VSV",
          "V",
          "VNV",
          "NV",
          "NNV",
        ];
        return dirs[Math.round(d / 22.5) % 16];
      }


		
      function windArrow(deg) {
        return `
  			<span style="display:inline-block; transform: rotate(${deg}deg);">
    			<svg ="20" height="20" viewBox="0 0 24 24">

        			stroke-="2"
        			fill="none"/>

      }

      /* =============================
      8 TIME

      function updateNow() {

        nowtime.innerHTML = now.toLocaleString();

        if (marker) {

          getDayNight(now, marker.getLatLng()) === "day"
          ? "☀️ Dag"
          : "🌙 Natt";
        }

      /* =============================
      9 ELAPSED
      ============================= */
      function updateElapsed() {
        const val = t0.value;
        if (!val) {
          elapsed.innerHTML = "";
          return;
        }

        const start = new Date(val);
        const now = new Date();

        let diff = Math.floor((now - start) / 1000);

        const days = Math.floor(diff / 86400);
        diff %= 86400;

        const h = Math.floor(diff / 3600);
        diff %= 3600;

        const m = Math.floor(diff / 60);
        const s = diff % 60;

        if (days > 0) {
          const dayText = days === 1 ? "dag" : "dager";
          elapsed.innerHTML = `Tid siden hendelse: ${days} ${dayText}, ${h}t ${m}m ${s}s`;
        } else {
          elapsed.innerHTML = `Tid siden hendelse: ${h}t ${m}m ${s}s`;
        }
      }


      /* =============================
      10 MAP
      ============================= */

      function placeIncident(pos) {
        // Hent riktig tile med vassdragsinformasjon

        const points = [
          [pos.lat, pos.lng],
          [pos.lat + 0.2, pos.lng],
          [pos.lat - 0.2, pos.lng],
          [pos.lat, pos.lng + 0.2],
          [pos.lat, pos.lng - 0.2],
        ];

        const promises = [];

        for (let p of points) {
          promises.push(loadTile("elvis", p[0], p[1]));
          promises.push(loadTile("innsjo", p[0], p[1]));
        }
		
		    //processedRiverSegments.clear();
		    failedTransitions.clear();

        Promise.all(promises).then(() => {
          console.log("✅ Tiles ferdig lastet");

          updateWeather().then(() => {
            updateMap();
          });
        });

        marker && map.removeLayer(marker);
        hotCircle && map.removeLayer(hotCircle);
        warmCircle && map.removeLayer(warmCircle);

        marker = L.marker(pos, { icon }).addTo(map);

        coords.innerHTML =
          "Ulykkessted: " +
          pos.lat.toFixed(5) +
          "° N, " +
          pos.lng.toFixed(5) +
          "° Ø";

          updateNow();

          // ✅ oppdater dag/natt med en gang
          if (t0.value) {
          dn_t0.innerHTML =
          getDayNight(new Date(t0.value), pos) === "day"
          ? "☀️ Dag"
          : "🌙 Natt";
        }

        // ✅ oppdater nå-visning med en gang
        dn_now.innerHTML =
        getDayNight(new Date(), pos) === "day" ? "☀️ Dag" : "🌙 Natt";
      }


		
      function updateMap() {
        if (!marker) return;

        const pos = marker.getLatLng();
        const hotR = +hot.value;
        const warmR = +warm.value;

        // fjern gamle
        hotCircle && map.removeLayer(hotCircle);
        warmCircle && map.removeLayer(warmCircle);
        plume && map.removeLayer(plume);
        plumeNow && map.removeLayer(plumeNow);
        flowLayer && map.removeLayer(flowLayer);

        // 🔴 HOTZONE (uendret)
        hotCircle = L.circle(pos, {
          radius: hotR,
          color: "red",
          fillColor: "red",
          fillOpacity: 0.3,
        }).addTo(map);

        // 🟠 YTRE RING (ny stil)
        warmCircle = L.circle(pos, {
          radius: warmR,
          color: "red",
          dashArray: "6,6",
          fillOpacity: 0,
        }).addTo(map);

        let windDir = 0;

        if (t0data && t0data.wind_from_direction !== undefined) {
          windDir = t0data.wind_from_direction + 180;
        }

        // ✳️ lag plume

        // ✅ vis kun plumer hvis T0 er satt
        if (t0.value) {
          plume = createPlume(pos, hotR, warmR, windDir).addTo(map);

          if (dynamicPlume && dynamicPlume.bringToBack) {
            dynamicPlume.addTo(map);
            dynamicPlume.bringToBack();
          }
        }

        // ✅ Nå-plume (skal alltid vises hvis vi har vinddata)
        if (lastWindDir !== undefined && marker) {
          const nowWindDeg = lastWindDir + 180;

          plumeNow = createStaticNowPlume(pos, hotR, warmR, nowWindDeg).addTo(
            map,
          );

          plumeNow.bringToBack();
        }

       
		    if (marker) {
		
		      createFlowLayer(pos).then(layer => {
		        if (flowLayer) {
		          map.removeLayer(flowLayer);
		        }
		
		        flowLayer = layer;
		
		        if (flowLayer) {
		      
			        flowLayer.addTo(map);

              if (flowLayer.eachLayer) {
                flowLayer.eachLayer(l => l.bringToFront());
              }
		        }
		      });
		
		    }     


        // sørg for at hotzone ligger øverst
        if (hotCircle) {
          hotCircle.bringToFront();
        }
      }

		
      function getStability(windSpeed) {
        if (windSpeed < 2) return "A";
        if (windSpeed < 4) return "B";
        if (windSpeed < 6) return "C";
        return "D";
      }

		
      function getSpreadFactor(stability) {
        return (
          {
            A: 2.0,
            B: 1.6,
            C: 1.3,
            D: 1.0,
          }[stability] || 1.0
        );
      }


		
      function createPlume(center, hotR, warmR, windDeg) {
        const lat = center.lat;
        const lon = center.lng;

        const rad = Math.PI / 180;
        const steps = 20;

        const points = [];

        const wind = windDeg * rad;

        // ✅ halvsirkel
        for (let i = 0; i <= steps; i++) {
          const a = wind - Math.PI / 2 + (i / steps) * Math.PI;
          const p = destination(lat, lon, a, hotR);
          points.push([p.lat, p.lng]);
        }

        // ✅ ytterbue
        const outer = [];
        for (let i = 0; i <= steps; i++) {
          const a = wind - 0.5 + (i / steps) * 1.0;
          const p = destination(lat, lon, a, warmR);
          outer.push([p.lat, p.lng]);
        }

        for (let i = outer.length - 1; i >= 0; i--) {
          points.push(outer[i]);
        }

        return L.polygon(points, {
          color: "orange",
          fillColor: "orange",
          fillOpacity: 0.3,
        });
      }


		
      function destination(lat, lon, angle, dist) {
        const R = 6378137;

        const newLat = lat + ((dist * Math.cos(angle)) / R) * (180 / Math.PI);
        const newLon =
          lon +
          (((dist * Math.sin(angle)) / R) * (180 / Math.PI)) /
            Math.cos((lat * Math.PI) / 180);

        return { lat: newLat, lng: newLon };
      }

      function createDynamicPlume(center, hotR, timeseries, windStart) {
        if (windStart === undefined || windStart === null) {
          console.warn("Ingen vindretning gitt");
          return null;
        }

        const rad = Math.PI / 180;
        const steps = 20;

        // enkel retning

        const step = 1500; // meter

        let cap = [];

        for (let i = 0; i <= steps; i++) {

          cap.push([p.lat, p.lng]);

        if (!cap || cap.length === 0) {

        const startLeft = cap[0];
        const startRight = cap[cap.length - 1];

        if (!startLeft || !startRight) {

        let left = { lat: cap[0][0], lng: cap[0][1] };
        let right = {
          lat: cap[cap.length - 1][0],
          lng: cap[cap.length - 1][1],
        };

        const leftEdge = [];
        const rightEdge = [];

        let currentCenter = center;
        let currentLeft = left;
        let currentRight = right;
        let totalTime = 0;

        for (let i = 0; i < timeseries.length; i++) {
          const step = timeseries[i];

          // ✅ konverter FRA → TIL
          const stepDir = ((step.dir + 180) * Math.PI) / 180;

          let prevDir = stepDir;

          if (i > 0) {
            prevDir = ((timeseries[i - 1].dir + 180) * Math.PI) / 180;
          }

          // beregn retningsendring
          let delta = stepDir - prevDir;

          // normaliser
          if (delta > Math.PI) delta -= 2 * Math.PI;
          if (delta < -Math.PI) delta += 2 * Math.PI;

          const turn = Math.abs(delta);

          // ✅ fremdrift
          // ✅ beregn tidsforskjell mellom punkter

          let dt = 1800;

          if (i > 0) {
            const prevTime = new Date(timeseries[i - 1].time);
            const currTime = new Date(timeseries[i].time);
            dt = (currTime - prevTime) / 1000;
          }

          totalTime += dt;

          // ✅ distanse = fart * tid
          const dist = step.speed * dt;

          if (i === 0) {
            // ✅ flytt center frem FØR første snitt
            currentCenter = destination(
              currentCenter.lat,
              currentCenter.lng,
              stepDir,
              dist,
            );

            const baseDir = stepDir;

            const leftDir = baseDir - Math.PI / 2;
            const rightDir = baseDir + Math.PI / 2;

            const width = hotR + Math.sqrt(dt) * 20;

            const leftPoint = destination(
              currentCenter.lat,
              currentCenter.lng,
              leftDir,
              width,
            );
            const rightPoint = destination(
              currentCenter.lat,
              currentCenter.lng,
              rightDir,
              width,
            );

            currentLeft = leftPoint;
            currentRight = rightPoint;

            leftEdge.push([leftPoint.lat, leftPoint.lng]);
            rightEdge.push([rightPoint.lat, rightPoint.lng]);

            continue;
          }
          // ✅ NORMAL CASE (i > 0)

          // flytt center
          currentCenter = destination(
            currentCenter.lat,
            currentCenter.lng,
            stepDir,
            dist,
          );

          // bredde
          const width = hotR + Math.sqrt(totalTime) * 20;

          // retning ut til sidene
          const leftDir = stepDir - Math.PI / 2;
          const rightDir = stepDir + Math.PI / 2;

          // lagre gamle først
          const prevLeftPt = { ...currentLeft };
          const prevRightPt = { ...currentRight };

          // beregn nye punkter
          const newLeft = destination(
            currentCenter.lat,
            currentCenter.lng,
            leftDir,
            width,
          );
          const newRight = destination(
            currentCenter.lat,
            currentCenter.lng,
            rightDir,
            width,
          );

          // ✅ bue basert på prev*
          if (turn > 0.2) {
            const segments = 10;
            const turningLeft = delta < 0;

            const pivot = turningLeft ? prevLeftPt : prevRightPt;
            const startPoint = turningLeft ? prevRightPt : prevLeftPt;

            const latFactor = Math.cos((pivot.lat * Math.PI) / 180);

            const dx0 = (startPoint.lng - pivot.lng) * latFactor;
            const dy0 = startPoint.lat - pivot.lat;

            for (let s = 1; s <= segments; s++) {
              const t = s / segments;

              const angle = -delta * t;

              const dx = dx0 * Math.cos(angle) - dy0 * Math.sin(angle);

              const dy = dx0 * Math.sin(angle) + dy0 * Math.cos(angle);

              const lng = pivot.lng + dx / latFactor;
              const lat = pivot.lat + dy;

              if (turningLeft) {
                rightEdge.push([lat, lng]);
              } else {
                leftEdge.push([lat, lng]);
              }
            }
          }

          // ✅ SÅ oppdaterer du
          currentLeft = newLeft;
          currentRight = newRight;

          leftEdge.push([newLeft.lat, newLeft.lng]);
          rightEdge.push([newRight.lat, newRight.lng]);
        }

        // Lage front på plumen
        const frontRight = rightEdge[rightEdge.length - 1];
        const frontLeft = leftEdge[leftEdge.length - 1];
        const frontPoints = [];

        const frontSteps = 10;

        // retning langs front (fra left → right)
        const dx = frontRight[0] - frontLeft[0];
        const dy = frontRight[1] - frontLeft[1];

        const frontAngle = Math.atan2(dy, dx);
        const centerDir = frontAngle - Math.PI / 2;

        const dx_end = frontRight[0] - frontLeft[0];
        const dy_end = frontRight[1] - frontLeft[1];

        // konverter til meter (samme som tidligere)
        const dLat = (dx_end * Math.PI) / 180;
        const dLng = (dy_end * Math.PI) / 180;

        const a =
          Math.sin(dLat / 2) ** 2 +
          Math.cos((frontLeft[0] * Math.PI) / 180) *
          Math.cos((frontRight[0] * Math.PI) / 180) *
          Math.sin(dLng / 2) ** 2;

        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        const R = 6378137;

        const finalWidth = R * c; // halv bredde (radius ut fra centerlinje)

        const centerRight = destination(
          frontRight[0],
          frontRight[1],
          centerDir,
          finalWidth,
        );

        const centerLeft = destination(
          frontLeft[0],
          frontLeft[1],
          centerDir,
          finalWidth,
        );

        // Høyre Kvartbue
        for (let i = 0; i <= frontSteps; i++) {
          const a = i / frontSteps;

          const angle = centerDir + Math.PI / 2 - (a * Math.PI) / 2;

          const p = destination(centerRight.lat, centerRight.lng, angle, hotR);

          frontPoints.push([p.lat, p.lng]);
        }

        // Venstre kvartbue
        for (let i = frontSteps; i >= 0; i--) {
          const a = i / frontSteps;

          const angle = centerDir - Math.PI / 2 + (a * Math.PI) / 2;

          const p = destination(centerLeft.lat, centerLeft.lng, angle, hotR);

          frontPoints.push([p.lat, p.lng]);
        }

        return L.polygon(
          [
            ...cap,
            ...rightEdge.slice(0, -1), // fjern siste punkt
            ...frontPoints,
            ...leftEdge.slice(0, -1).reverse(),
          ],
          {
            color: "#888",
            weight: 1.5,
            dashArray: "4,8",
            fill: true,
            fillOpacity: 0.15,
            fillColor: "#666",
          },
        );
      }


		
      function createStaticNowPlume(center, hotR, warmR, windDeg) {

        const rad = Math.PI / 180;

        const wind = windDeg * rad;

        // ✅ halvsirkel (samme som før)
        for (let i = 0; i <= steps; i++) {
          const a = wind - Math.PI / 2 + (i / steps) * Math.PI;
          const p = destination(lat, lon, a, hotR);
          points.push([p.lat, p.lng]);
        }

        // ✅ ytterbue
        const outer = [];
        for (let i = 0; i <= steps; i++) {
          const a = wind - 0.5 + (i / steps) * 1.0;
          const p = destination(lat, lon, a, warmR);
          outer.push([p.lat, p.lng]);
        }

        // legg til ytterbue baklengs
        for (let i = outer.length - 1; i >= 0; i--) {
          points.push(outer[i]);
        }

        return L.polygon(points, {
          color: "#cccc66", // ✅ lysegul kant
          fillColor: "#ffff99", // ✅ lysegul fyll
          fillOpacity: 0.4,
        });
      }

      function pointInPolygon(point, vs) {
        let x = point[0], y = point[1];
        let inside = false;
      
        for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
          let xi = vs[i][0], yi = vs[i][1];
          let xj = vs[j][0], yj = vs[j][1];
      
          let intersect =
            yi > y !== yj > y &&
            x < ((xj - xi) * (y - yi)) / (yj - yi) + xi;
      
          if (intersect) inside = !inside;
        }
      
        return inside;
      }

		
		
      function distanceToSegment(p, v, w) {
        const l2 = Math.pow(v[0] - w[0], 2) + Math.pow(v[1] - w[1], 2);

        if (l2 === 0) return distMeters(p, v);

        let t =
          ((p.lat - v[0]) * (w[0] - v[0]) + (p.lng - v[1]) * (w[1] - v[1])) /
          l2;

        t = Math.max(0, Math.min(1, t));

        const proj = [v[0] + t * (w[0] - v[0]), v[1] + t * (w[1] - v[1])];

        return distMeters(p, proj);
      }


		
      function projectPointToSegment(p, v, w) {
        const l2 = Math.pow(v[0] - w[0], 2) + Math.pow(v[1] - w[1], 2);

        if (l2 === 0) return v;

        let t =
          ((p.lat - v[0]) * (w[0] - v[0]) + (p.lng - v[1]) * (w[1] - v[1])) /
          l2;

        t = Math.max(0, Math.min(1, t));

        return [v[0] + t * (w[0] - v[0]), v[1] + t * (w[1] - v[1])];
      }

              // ✅ STRAFF oppover kraftig
              if (diff > 0) {
                score -= diff * 200;
              }

              // 🔥 RETNING (NYTT)
              if (lastPoint) {
                const dir = [
                  current[0] - lastPoint[0],
                  current[1] - lastPoint[1],
                ];

                const v = [c[0] - current[0], c[1] - current[1]];

                // ✅ normaliser
                const len1 = Math.sqrt(dir[0] * dir[0] + dir[1] * dir[1]);
                const len2 = Math.sqrt(v[0] * v[0] + v[1] * v[1]);

                let dot = 0;

                if (len1 > 0 && len2 > 0) {
                  dot =
                    (dir[0] / len1) * (v[0] / len2) +
                    (dir[1] / len1) * (v[1] / len2);
                }

                // ✅ blokkér kun ren bakover
                if (dot < -0.7) continue;

                // ✅ kraftig retningsbias
                score += dot * 200000;
              }

              if (score > globalScore) {
                globalScore = score;
                globalBest = c;
              }
            }
          }
        }
		  

        if (globalBest) {
          return globalBest;
        }
        
        // ✅ fallback: velg nærmeste punkt videre
        let fallback = null;
        let bestDist = Infinity;
        
        for (let key in loadedTiles) {
          if (!key.startsWith("elvis")) continue;
        
          const data = loadedTiles[key];
          if (!data) continue;
        
          for (let f of data.features) {

            const lines =
              geom.type === "LineString"
                ? [geom.coordinates]
                : geom.type === "MultiLineString"
                ? geom.coordinates
                : [];
        
            for (let line of lines) {
              for (let pt of line) {
                const candidate = [pt[1], pt[0]];
        
                const d = distMeters(
                  { lat: current[0], lng: current[1] },
                  candidate
                );
        
                if (d < bestDist) {
                  bestDist = d;
                  fallback = candidate;
                }
              }
            }
          }
        }
        
        return fallback;   // ✅ ALDRI null
          
      }

      function getElevationFromImage(img, lat, lng, z) {
        if (!img._ctx) {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d", { willReadFrequently: true });

          canvas.width = img.width;
          canvas.height = img.height;

          ctx.drawImage(img, 0, 0);

          img._ctx = ctx;
        }

        const scale = Math.pow(2, z);

        const worldX = ((lng + 180) / 360) * scale * 256;
        const worldY =
          ((1 -
            Math.log(
              Math.tan((lat * Math.PI) / 180) +
              1 / Math.cos((lat * Math.PI) / 180),
            ) /
            Math.PI) /
          2) *
          scale *
          256;

        const px = Math.floor(worldX % 256);
        const py = Math.floor(worldY % 256);

        const pixel = img._ctx.getImageData(px, py, 1, 1).data;

        const r = pixel[0];
        const g = pixel[1];
        const b = pixel[2];

        return (r * 256 * 256 + g * 256 + b) * 0.1 - 10000;
      }

      async function getSteepestDirectionDEM(lat, lng, step = 60) {
        const dirs = [0, 45, 90, 135, 180, 225, 270, 315];

        const base = await getElevationCached(lat, lng);

        let best = null;
        let lowest = base;

        for (let d of dirs) {
          const p = destination(lat, lng, (d * Math.PI) / 180, step);
          const e = await getElevationCached(p.lat, p.lng);

          if (e < lowest) {
            lowest = e;
            best = p;
          }
        }

        return best;
      }


  
      async function traceFlow(startLat, startLng, steps = 20) {
        let path = [[startLat, startLng]];
        let current = { lat: startLat, lng: startLng };

        for (let i = 0; i < steps; i++) {
          const next = await getSteepestDirectionDEM(
            current.lat,
            current.lng,
          );

          if (!next) break;

          path.push([next.lat, next.lng]);
          current = next;
        }

        return path;
      }


		
      function fixRiverDirection(riverLine, riverIndex, current, lastPoint) {
        if (!riverLine || riverIndex < 1 || riverIndex >= riverLine.length - 1 || !lastPoint) {
          return riverIndex;
        }

        const pPrev = riverLine[riverIndex - 1];
        const pNext = riverLine[riverIndex + 1];

        const vFlow = {
          x: current.lng - lastPoint[1],
          y: current.lat - lastPoint[0]
        };

        const v1 = {
          x: pNext[0] - current.lng,
          y: pNext[1] - current.lat
        };

        const v2 = {
          x: pPrev[0] - current.lng,
          y: pPrev[1] - current.lat
        };

        const dot1 = vFlow.x * v1.x + vFlow.y * v1.y;
        const dot2 = vFlow.x * v2.x + vFlow.y * v2.y;

        if (dot1 > dot2) {
          return Math.min(riverLine.length - 1, riverIndex + 1);
        } else {
          return Math.max(0, riverIndex - 1);
        }
      }

                  const end = riverEndings.get(snap.segmentId);

                                    
                  const moveDist = distMeters(
                    { lat: current.lat, lng: current.lng },
                    snap.point
                  );

                  if (moveDist < 5) {
                    console.log("DROP SNAP – for liten bevegelse");
                    continue;
                  }

                
                  current = {
                  lat: end.lat,
                  lng: end.lng
                  };
                
                  poly.addLatLng([current.lat, current.lng]);
                
                  break;
                }

                stepsSinceSnap = 0;
                
                if (snap.segmentId === segmentId) {
                  console.log("DROP – samme segment etter snap");
                  continue;
                }

                
                /*if (processedRiverSegments.has(snap.segmentId)) {
                    console.log("SKIPPER allerede brukt segment:", snap.segmentId);
                    continue;
                  }
                
                processedRiverSegments.add(snap.segmentId);	*/						

                loopCount = 0;
                console.log("HOPPER TIL NY ELV");

              
                // ✅ lagre hvor vi kom fra
                lastSegmentId = segmentId;
                lastRiverIndex = riverIndex;

            
                riverLine = snap.line;
                riverIndex = snap.index;
                segmentId = snap.segmentId;
            
                current = {
                  lat: snap.point[0],
                  lng: snap.point[1]
                };

                  riverIndex = fixRiverDirection(
                    riverLine,
                    riverIndex,
                    current,
                    lastPoint
                  );

            
                cameFromSnap = true;   // ✅ NY
            
                poly.addLatLng([current.lat, current.lng]);
                continue;
              }
            
              // ✅ 2: større radius
    
              const snapFar = await snapToNextRiver(
                { lat: current.lat, lng: current.lng },
                segmentId,
                lastPoint,
                25,
                allowBacktracking
              );
              
              if (snapFar && snapFar.point && snapFar.point[0] != null && snapFar.point[1] != null) {
                
                if (riverEndings.has(snapFar.segmentId)) {
                  console.log("HOPPER DIREKTE TIL SLUTT (extended)");
                
                  const end = riverEndings.get(snapFar.segmentId);
                
                  current = {
                    lat: end.lat,
                    lng: end.lng
                  };
                
                  poly.addLatLng([current.lat, current.lng]);
                
                  break;
                }
                
                stepsSinceSnap = 0;
                
                if (snapFar.segmentId === segmentId) {
                console.log("DROP (extended) – samme segment");
                continue;
                }

                /*
                if (processedRiverSegments.has(snapFar.segmentId)) {
                  console.log("SKIPPER (extended) segment:", snapFar.segmentId);
                  continue;
                }

                processedRiverSegments.add(snap.segmentId);*/

                loopCount = 0;
                console.log("UTVIDET HOPP");
              
                lastSegmentId = segmentId;
                lastRiverIndex = riverIndex;

                riverLine = snapFar.line;
                riverIndex = snapFar.index;
                segmentId = snapFar.segmentId;
              
                current = {
                  lat: snapFar.point[0],
                  lng: snapFar.point[1]
                };

                riverIndex = fixRiverDirection(
                  riverLine,
                  riverIndex,
                  current,
                  lastPoint
                );
                
                cameFromSnap = true;

                poly.addLatLng([current.lat, current.lng]);
                continue;
              }
              
              
              
              
              // ✅ hvis ingenting annet traff → fortsett langs elva
              continue;

            }	
            
            
            // ✅ DEM FLOW
            if (!onRiver) {
              const next = await getSteepestDirectionDEM(
                current.lat,
                current.lng,
                30
              );

              if (!next) break;

              current = next;

              // ✅ FALLBACK (flyttet hit – RIKTIG sted)
              const nearest = findNearestStream(current);

              
              if (nearest) {
                const d = distMeters(current, nearest);

                if (d < 40) {   // viktig terskel

                  const zCurrent = await getElevationCached(current.lat, current.lng);
                  const zNearest = await getElevationCached(nearest[0], nearest[1]);

                  if (zNearest !== undefined && zCurrent !== undefined) {
                    if (zNearest > zCurrent + 2) {
                      console.log("DROP DEM fallback – går oppover");
                    } else {
                      console.log("DEM fallback → snap");

                      current = {
                        lat: nearest[0],
                        lng: nearest[1]
                      };

                      cameFromFallback = true;
                    }
                  }
                }
              }

            }

				  
            if (isInWater(current.lat, current.lng)) {
              console.log("TREFFER INNSJØ/KYST – STOPPER");
            
              // ✅ LAGRE SLUTTPUNKT FOR DENNE ELVA
              riverEndings.set(segmentId, {
                lat: current.lat,
                lng: current.lng
              });
            
              break;
            }

				
            if (i % 5 === 0) {
              await new Promise(requestAnimationFrame);
            }								
			    }

			    // await connectFlowsToWater(poly);

                       

          // 🔴 FORCE SNAP kun hvis vi IKKE allerede traff elv
           
          if (!onRiver && path.length > 60){
          
            const lastPoint = path[path.length - 1];
          
            const stream = findNearestStream({
              lat: lastPoint[0],
              lng: lastPoint[1]
            });
          
            if (stream){
          
              const d = distMeters(
                {lat: lastPoint[0], lng: lastPoint[1]},
                stream
              );
          
              if (d < 200){   // ✅ viktig
          
                console.log("FORCED SNAP");
          
                path.push([stream[0], stream[1], "river"]);
              }
            }
          }
			
          console.log("PATH LENGTH:", path.length);

          if (path.length > 1) {
            layers.push(
              L.polyline(path, {
                color: "#ff0000",
                weight: 3,
                opacity: 0.8,
              }),
            );
          }
        }
        
        return L.layerGroup(layers);
      }

      
		
      function smoothPath(path) {
        if (!path || path.length < 2) return path;

        const smooth = [];

        for (let i = 1; i < path.length; i++) {
          const prev = path[i - 1];
          const curr = path[i];

          const mid = [(prev[0] + curr[0]) / 2, (prev[1] + curr[1]) / 2];

          smooth.push(prev);
          smooth.push(mid);
        }

        smooth.push(path[path.length - 1]);

        return smooth;
      }


		
      async function connectFlowsToWater(layer) {
        layer.eachLayer(async (poly) => {
          const latlngs = poly.getLatLngs();
          if (!latlngs || latlngs.length === 0) return;

          const last = latlngs[latlngs.length - 1];

          const stream = findNearestStream(last);

          if (!stream) {
            console.log("Ingen ELVIS funnet");
            return;
          }

          // ✅ tegn kobling til elv
          L.polyline([[last.lat, last.lng], stream], {
            color: "#00ffff",
            weight: 4,
          }).addTo(map);

          // ✅ følg elva videre
          const rawPath = await followFullRiverDEM(stream);
          const path = smoothPath(rawPath);

          if (path && path.length > 0) {
            L.polyline(path, {
              color: "#00ffff",
              weight: 3,
            }).addTo(map);
          }
        });
      }


		
      async function fetchWaterBodies(lat, lng, radius = 100) {
        const url = `/api/overpass?lat=${lat}&lng=${lng}&radius=${radius}`;

        try {
          const res = await fetch(url);
          const data = await res.json();

          return data && data.elements ? data.elements : [];
        } catch (e) {
          console.warn("Water fetch error", e);
          return [];
        }
      }

      
		
      /* =============================
      11 CLICK
      ============================= */
      map.on("click", (e) => {
        if (locked) return;
        placeIncident(e.latlng);
        locked = true;
      });

      
		
      /* =============================
      12 EVENTS
      ============================= */
      const sizeSelect = document.getElementById("size");

      size.onchange = updateEventText;
      locationType.onchange = updateEventText;
      fireType.onchange = updateEventText;

      un.oninput = () => {
        const d = findByUN(un.value);
        if (!d) return;

        name.value = d.name;
        hot.value = d.hot;
        warm.value = d.warm;

        updateMap();
        updateWeather(); // ✅ LEGG TIL DENNE
      };

      name.oninput = () => {
        const d = findByName(name.value);
        if (!d) return;

        un.value = d.un;
        hot.value = d.hot;
        warm.value = d.warm;

        updateMap();
        updateWeather(); // ✅ LEGG TIL
      };

      t0.oninput = () => {
        if (!marker) return;

        const pos = marker.getLatLng();
        const d = new Date(t0.value);

        dn_t0.innerHTML = getDayNight(d, pos) === "day" ? "☀️ Dag" : "🌙 Natt";

        if (t0.value) {
          updateWeather();
        }
        updateWeather();
      };

      hot.oninput = () => {
        updateMap();

        // 🔴 Tving plume refresh med en gang (uten API-delay)
        if (t0.value && marker) {
          if (dynamicPlume) {
            map.removeLayer(dynamicPlume);
          }

          dynamicPlume = createDynamicPlume(
            marker.getLatLng(),
            Number(hot.value),
            [], // vi bruker ikke timeseries her
            t0WindDir + 180,
          );

          if (dynamicPlume) {
            map.addLayer(dynamicPlume);
          }
        }

        updateWeather();
      };

      function newLocation() {
        locked = false;
      }

      
		
      /* =============================e
      INTERVALS
      ============================= */
      setInterval(updateNow, 60000);
      setInterval(updateWeather, 600000);
      setInterval(updateElapsed, 1000);

      updateNow(); // ✅ kjør én gang ved start
    </script>
  </body>
